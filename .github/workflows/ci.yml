name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: "5.4"
      - uses: leafo/gh-actions-luarocks@v6.1.0
      - run: luarocks install luacheck
      - run: luacheck .

  test:
    name: Test (${{ matrix.lua }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lua: ["5.1", "5.3", "5.4", "luajit-2.1"]
    steps:
      - uses: actions/checkout@v7
      - uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: ${{ matrix.lua }}
      - run: TZ=UTC lua spec/run.lua
      - run: TZ=Europe/Vienna lua spec/run.lua
      - run: for f in contrib/*.sh; do sh -n "$f" || exit 1; done
      - name: shellcheck
        run: |
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck contrib/*.sh
          else
            echo "shellcheck not installed, skipping"
          fi
